# chat-mod 폴더 (힐링타운 채팅창 모드 소스) 를 올리거나 고치면
#  → 모드 jar 를 만들어 mods/required/ (필수 · 런처에서 못 끔) 에 넣고 → 모드 목록 자동 갱신 (update-distro.yml) 까지 실행
#  실패하면: Actions 탭 → '채팅창 모드 빌드' → 빨간 X → build 단계의 오류 글자를 알려 주세요
name: 채팅창 모드 빌드

on:
  push:
    branches: [main, master]
    paths:
      - 'chat-mod/**'
      - '.github/workflows/build-chat-mod.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-chat-mod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: build
        working-directory: chat-mod
        run: gradle build --no-daemon

      - name: jar 받기 (Actions 결과에서도 받을 수 있게)
        uses: actions/upload-artifact@v4
        with:
          name: healingtown-chat
          path: chat-mod/build/libs/*.jar

      - name: mods/required 폴더에 넣기 (필수 모드 - 런처에서 못 끔)
        run: |
          rm -f mods/healingtown-chat-*.jar mods/*/healingtown-chat-*.jar
          mkdir -p mods/required
          for f in chat-mod/build/libs/healingtown-chat-*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) continue;; esac
            cp "$f" mods/required/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mods
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "힐링타운 채팅창 모드 빌드"
          git pull --rebase
          git push

      - name: 모드 목록 갱신 (update-distro.yml)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-distro.yml --ref "${{ github.ref_name }}"
