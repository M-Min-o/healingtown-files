# mods 폴더에 jar 를 올리거나 지우면 → distribution.json 의 모드 목록을 자동으로 다시 만듦
#  - 손으로 distribution.json 을 고칠 필요 없음 (서버 주소 · 이름 같은 다른 내용은 그대로 둠)
#  - 결과는 모드-확인결과.md 에 적힘 (안 들어간 모드는 이유도 같이)
#
#   mods/                 기본 켜짐 (런처 설정 → 모드 에서 끌 수 있음)
#   mods/optional-off/    기본 꺼짐 (유저가 켜야 함)
#   mods/required/        필수 (끌 수 없음)
#   다른 모드가 필요로 하는 모드(예: Fabric API)는 자동으로 필수
name: 모드 목록 자동 갱신

on:
  push:
    branches: [main, master]
    paths:
      - 'mods/**'
      - '.github/workflows/update-distro.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-distro
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 모드 확인 · 목록 다시 만들기
        run: |
          cat > "$RUNNER_TEMP/update-distro.js" <<'SCRIPT_END'
          /**
           * 힐링타운 모드 목록 자동 갱신 (GitHub Actions 에서 실행)
           *
           *  mods 폴더에 .jar 를 올리면 → distribution.json 의 모드 목록을 다시 만들고 → 런처가 다음 실행 때 받아감
           *
           *   mods/                 기본 켜짐 (런처 설정 → 모드에서 끌 수 있음)
           *   mods/optional-on/     기본 켜짐 (위와 같음)
           *   mods/optional-off/    기본 꺼짐 (유저가 켜야 함)
           *   mods/required/        필수 (끌 수 없음)
           *
           *  - 다른 모드가 필요로 하는 모드(예: Fabric API)는 자동으로 '필수'
           *  - 마크 버전이 안 맞는 모드 · 필요한 모드가 빠진 모드는 넣지 않음 (게임이 튕기지 않게) → 모드-확인결과.md 에 이유를 적음
           *  - 런처 설정 → 모드 에 보이는 이름은 모드 안의 이름 (예: Sodium)
           */
          const fs = require('fs')
          const path = require('path')
          const crypto = require('crypto')
          const os = require('os')
          const { execFileSync } = require('child_process')

          const ROOT = process.cwd()
          const DIST = path.join(ROOT, 'distribution.json')
          const MODS = path.join(ROOT, 'mods')
          const [owner, repo] = (process.env.GITHUB_REPOSITORY || 'M-Min-o/healingtown-files').split('/')
          const BASE = `https://${owner.toLowerCase()}.github.io/${repo}/`

          const dist = JSON.parse(fs.readFileSync(DIST, 'utf-8'))
          const server = dist.servers[0]
          const MC = server.minecraftVersion

          // ------------------------------------------------------------------ 버전 비교 (Fabric 의 버전 범위 문법 대부분)
          function parseVer(v) {
              v = String(v).trim()
              const dash = v.indexOf('-')
              const core = (dash >= 0 ? v.slice(0, dash) : v).split('+')[0]
              const pre = dash >= 0 ? v.slice(dash + 1).split('+')[0] : null
              return { nums: core.split('.').map(x => (x === 'x' || x === 'X' || x === '*') ? null : (parseInt(x, 10) || 0)), pre }
          }
          function cmp(a, b) {
              const A = parseVer(a), B = parseVer(b)
              for (let i = 0; i < Math.max(A.nums.length, B.nums.length); i++) {
                  const x = A.nums[i] ?? 0, y = B.nums[i] ?? 0
                  if (x !== y) return x < y ? -1 : 1
              }
              if (A.pre === B.pre) return 0
              if (A.pre === null) return 1
              if (B.pre === null) return -1
              return A.pre < B.pre ? -1 : A.pre > B.pre ? 1 : 0
          }
          function one(cond, v) {
              cond = cond.trim()
              if (!cond || cond === '*') return true
              const m = cond.match(/^(>=|<=|>|<|=|~|\^)?\s*(.+)$/)
              const op = m[1] || '', ver = m[2]
              if (/[xX*]/.test(ver)) {                                  // 1.21.x
                  const want = ver.split('.'), have = parseVer(v).nums
                  return want.every((w, i) => /^[xX*]$/.test(w) || parseInt(w, 10) === have[i])
              }
              const c = cmp(v, ver)
              switch (op) {
                  case '>=': return c >= 0
                  case '<=': return c <= 0
                  case '>': return c > 0
                  case '<': return c < 0
                  case '~': { const n = parseVer(ver).nums; return c >= 0 && cmp(v, `${n[0]}.${(n[1] || 0) + 1}.0-`) < 0 }
                  case '^': { const n = parseVer(ver).nums; return c >= 0 && cmp(v, `${(n[0] || 0) + 1}.0.0-`) < 0 }
                  default: return c === 0
              }
          }
          function matches(range, v) {
              if (range == null) return true
              const list = Array.isArray(range) ? range : [range]
              return list.some(r => String(r).split(/\s+/).filter(Boolean).every(c => one(c, v)))
          }

          // ------------------------------------------------------------------ jar 읽기
          function readFmj(jar) {
              try {
                  const txt = execFileSync('unzip', ['-p', jar, 'fabric.mod.json'], { maxBuffer: 16 << 20, stdio: ['ignore', 'pipe', 'ignore'] }).toString('utf-8')
                  return JSON.parse(txt.replace(/[\u0000-\u0019]+/g, ' '))
              } catch (e) { return null }
          }
          /** 이 jar 와 안에 든 jar 들이 주는 모드 아이디 */
          function providedIds(jar, depth = 0) {
              const out = new Set()
              const f = readFmj(jar)
              if (f) { out.add(f.id); for (const p of (f.provides || [])) out.add(p) }
              if (depth >= 2) return out
              let list = []
              try { list = execFileSync('unzip', ['-Z1', jar], { maxBuffer: 64 << 20, stdio: ['ignore', 'pipe', 'ignore'] }).toString().split('\n').filter(n => /^META-INF\/jars\/.+\.jar$/.test(n)) } catch (e) { /* 없음 */ }
              if (!list.length) return out
              const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'jij-'))
              for (const n of list) {
                  try {
                      execFileSync('unzip', ['-o', '-q', jar, n, '-d', tmp])
                      for (const id of providedIds(path.join(tmp, n), depth + 1)) out.add(id)
                  } catch (e) { /* 무시 */ }
              }
              fs.rmSync(tmp, { recursive: true, force: true })
              return out
          }

          // Fabric 로더(0.15 이상)가 직접 주는 것: mixinextras 등 → 따로 없어도 됨
          const IGNORE_DEPS = new Set(['minecraft', 'java', 'fabricloader', 'fabric-loader', 'fabric', 'mixinextras'])
          function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9_.-]+/g, '-').replace(/^-+|-+$/g, '') || 'mod' }

          // ------------------------------------------------------------------ 모드 모으기
          const groups = [['', 'auto'], ['optional-on', 'auto'], ['optional-off', 'off'], ['required', 'required']]
          const mods = []
          for (const [dir, kind] of groups) {
              const d = path.join(MODS, dir)
              if (!fs.existsSync(d)) continue
              for (const f of fs.readdirSync(d).sort()) {
                  if (!f.toLowerCase().endsWith('.jar')) continue
                  const file = path.join(d, f)
                  if (!fs.statSync(file).isFile()) continue
                  const buf = fs.readFileSync(file)
                  const fmj = readFmj(file)
                  mods.push({ file, rel: path.relative(ROOT, file).split(path.sep).join('/'), name: f, kind, buf, fmj,
                      ids: providedIds(file), md5: crypto.createHash('md5').update(buf).digest('hex') })
              }
          }

          const report = []
          const skipped = []
          // 1) 마크 버전
          let ok = mods.filter(m => {
              if (!m.fmj) { skipped.push([m.name, 'Fabric 모드가 아님 (fabric.mod.json 없음 - 포지 · 네오포지 모드는 안 됨)']); return false }
              const r = m.fmj.depends && m.fmj.depends.minecraft
              if (!matches(r, MC)) { skipped.push([m.name, `마크 ${MC} 용이 아님 (이 모드: ${JSON.stringify(r)})`]); return false }
              return true
          })
          // 같은 모드가 두 개면 버전 높은 것만
          const byId = new Map()
          for (const m of ok) {
              const prev = byId.get(m.fmj.id)
              if (!prev) { byId.set(m.fmj.id, m); continue }
              const keep = cmp(String(m.fmj.version), String(prev.fmj.version)) > 0 ? m : prev
              const drop = keep === m ? prev : m
              skipped.push([drop.name, `같은 모드(${m.fmj.id})가 또 있음 → ${keep.name} 만 씀`])
              byId.set(m.fmj.id, keep)
          }
          ok = [...byId.values()]
          // 2) 필요한 모드가 다 있는지 (빠지면 그 모드는 뺌, 몇 번 반복)
          for (let round = 0; round < 5; round++) {
              const have = new Set()
              for (const m of ok) for (const id of m.ids) have.add(id)
              const next = ok.filter(m => {
                  const miss = Object.keys(m.fmj.depends || {}).filter(id => !IGNORE_DEPS.has(id) && !have.has(id))
                  if (miss.length) { skipped.push([m.name, `필요한 모드가 없음: ${miss.join(', ')}`]); return false }
                  return true
              })
              if (next.length === ok.length) break
              ok = next
          }
          // 3) 다른 모드가 필요로 하면 필수
          //    (예: Sodium 안에도 Fabric API 조각이 들어 있지만, 필요한 걸 '직접' 주는 모드 → Fabric API → 그 밖 순으로 하나만 골라 필수로)
          for (const m of ok) if (m.kind === 'required') m.required = true
          for (let changed = true, guard = 0; changed && guard < 10; guard++) {
              changed = false
              for (const o of ok) {
                  for (const id of Object.keys(o.fmj.depends || {})) {
                      if (IGNORE_DEPS.has(id)) continue
                      const providers = ok.filter(p => p !== o && p.ids.has(id))
                      if (!providers.length || providers.some(p => p.required)) continue
                      const pick = providers.find(p => p.fmj.id === id || (p.fmj.provides || []).includes(id))
                          || providers.find(p => p.fmj.id === 'fabric-api') || providers[0]
                      pick.required = true
                      pick.why = `${o.fmj.name || o.fmj.id} 에 필요`
                      changed = true
                  }
              }
          }
          const label = m => String(m.fmj.name || m.fmj.id)
          ok.sort((a, b) => (b.required ? 1 : 0) - (a.required ? 1 : 0) || label(a).localeCompare(label(b)))   // 필수 먼저, 그다음 이름 순

          // ------------------------------------------------------------------ distribution.json 다시 쓰기
          const modules = ok.map(m => {
              const ver = slug(String(m.fmj.version || '1')).replace(/^-+/, '') || '1'
              const mod = {
                  id: `kr.healingtown.mods:${slug(m.fmj.id)}:${ver}`,
                  name: label(m),
                  type: 'FabricMod',
                  artifact: { size: m.buf.length, MD5: m.md5, url: BASE + m.rel.split('/').map(x => encodeURIComponent(x).replace(/%2B/g, '+')).join('/') }
              }
              if (!m.required) mod.required = { value: false, def: m.kind !== 'off' }
              return mod
          })

          const before = JSON.stringify(server.modules.filter(x => x.type === 'FabricMod'))
          const fabric = server.modules.filter(x => x.type === 'Fabric')
          const rest = server.modules.filter(x => x.type !== 'Fabric' && x.type !== 'FabricMod')
          server.modules = [...fabric, ...modules, ...rest]
          if (JSON.stringify(modules) !== before) {
              const v = String(server.version || '1.0.0').split('.').map(n => parseInt(n, 10) || 0)
              while (v.length < 3) v.push(0)
              v[2]++
              server.version = v.join('.')
          }
          fs.writeFileSync(DIST, JSON.stringify(dist, null, 2) + '\n')

          // ------------------------------------------------------------------ 결과 적기
          report.push('# 모드 확인 결과', '', `자동으로 만든 파일입니다 (마크 ${MC} · 서버 정보 버전 ${server.version}). mods 폴더에 jar 를 올리면 1~2분 뒤 다시 만들어집니다.`, '')
          report.push('## 들어간 모드', '', '| 모드 | 버전 | 런처에서 | 파일 |', '|---|---|---|---|')
          for (const m of ok) report.push(`| ${label(m)} | ${m.fmj.version} | ${m.required ? '필수' + (m.why ? ` (${m.why})` : '') : m.kind === 'off' ? '선택 (기본 꺼짐)' : '선택 (기본 켜짐)'} | ${m.rel} |`)
          report.push('')
          if (skipped.length) {
              report.push('## 안 들어간 모드 (고쳐서 다시 올려 주세요)', '', '| 파일 | 이유 |', '|---|---|')
              for (const [n, why] of skipped) report.push(`| ${n} | ${why} |`)
              report.push('')
          }
          fs.writeFileSync(path.join(ROOT, '모드-확인결과.md'), report.join('\n') + '\n')
          console.log(report.join('\n'))
          SCRIPT_END
          node "$RUNNER_TEMP/update-distro.js"

      - name: 바뀐 것 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution.json 모드-확인결과.md
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git commit -m "모드 목록 자동 갱신"
          git push
          echo "CHANGED=1" >> "$GITHUB_ENV"

      - name: 사이트(GitHub Pages) 다시 올리기
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "사이트는 잠시 뒤 자동으로 올라갑니다"
